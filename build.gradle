plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.2'
    id 'io.spring.dependency-management' version '1.1.6'
    id 'maven-publish'
}

group = 'com.cardanoj'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = '17'
    targetCompatibility = '17'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web:3.3.2'
    testImplementation 'org.springframework.boot:spring-boot-starter-test:3.3.2'
}

tasks.named('bootBuildImage') {
    builder = 'paketobuildpacks/builder-jammy-base:latest'
}

tasks.named('test') {
    useJUnitPlatform()
}


publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = 'ApiCardanojApi'

            pom {
                name.set('CardanoJ API')
                description.set('Java library for Cardano functionalities.')
                url.set('https://github.com/CardanoJ/cardanoJ')

                licenses {
                    license {
                        name.set('Apache License, Version 2.0')
                        url.set('http://www.apache.org/licenses/LICENSE-2.0')
                    }
                }
                
                scm {
                    connection.set('scm:git:git://github.com/CardanoJ/cardanoJ.git')
                    developerConnection.set('scm:git:ssh://github.com/CardanoJ/cardanoJ.git')
                    url.set('https://github.com/CardanoJ/cardanoJ')
                }
            }
        }
    }

    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri('https://maven.pkg.github.com/CardanoJ/cardanoJ')
            credentials {
                username = project.findProperty('gpr.user') ?: System.getenv('GITHUB_ACTOR')
                password = project.findProperty('gpr.token') ?: System.getenv('GITHUB_TOKEN')
            }
        }
    }
}