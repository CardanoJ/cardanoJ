plugins {
    id 'java'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.9.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    // Retrofit with Gson Converter
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'

    // Retrofit
    implementation 'com.squareup.retrofit2:retrofit:2.10.0'

    // OkHttp
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Jackson Annotations
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.17.0'

    // Jackson Core
    implementation 'com.fasterxml.jackson.core:jackson-core:2.17.0'

    // Jackson Databind
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.0'

    // CBOR
    implementation 'co.nstant.in:cbor:0.9'

    // Guava
    implementation 'com.google.guava:guava:33.1.0-jre'

    // Bouncy Castle Provider
    implementation 'org.bouncycastle:bcprov-jdk18on:1.77'

    // SLF4J API
//    implementation 'org.slf4j:slf4j-api:2.1.0-alpha1'
// https://mvnrepository.com/artifact/org.slf4j/slf4j-api
    implementation 'org.slf4j:slf4j-api:2.0.11'
// https://mvnrepository.com/artifact/org.slf4j/slf4j-reload4j
    testImplementation 'org.slf4j:slf4j-reload4j:2.0.11'
// https://mvnrepository.com/artifact/org.slf4j/slf4j-reload4j
    testImplementation 'org.slf4j:slf4j-reload4j:1.7.36'

    // EdDSA
    implementation 'net.i2p.crypto:eddsa:0.3.0'

    // Retrofit Converter for Jackson
    implementation 'com.squareup.retrofit2:converter-jackson:2.10.0'

    // Lombok (provided scope)
//    compileOnly 'org.projectlombok:lombok:1.18.30'
    compileOnly 'org.projectlombok:lombok:1.18.32'
    annotationProcessor 'org.projectlombok:lombok:1.18.32'

    testCompileOnly 'org.projectlombok:lombok:1.18.32'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.32'
    testImplementation('org.assertj:assertj-core:3.23.1')
// https://mvnrepository.com/artifact/org.mockito/mockito-core
    testImplementation 'org.mockito:mockito-core:5.10.0'
// https://mvnrepository.com/artifact/org.mockito/mockito-junit-jupiter
    testImplementation 'org.mockito:mockito-junit-jupiter:5.10.0'
// https://mvnrepository.com/artifact/org.hamcrest/hamcrest
    testImplementation 'org.hamcrest:hamcrest:2.2'


}

test {
    useJUnitPlatform()
}